# Fixed 30-message conversation for Part 3 (same text for every setting).
# Probe facts are planted at messages 2, 8, 14, 20 and 26.
messages:
  - "Hi, I coordinate clinical trials at a university hospital. Can you help me stay organized this week?"
  - "The trial I am coordinating is registered as NCT05512874. It tests an oral GLP-1 drug in adults with type 2 diabetes."
  - "What is the difference between a Phase II and a Phase III trial, in one or two sentences?"
  - "What should an informed consent form always include?"
  - "How do I explain randomization to a nervous participant?"
  - "What does 'double-blind' mean in practice for the site staff?"
  - "Give me two tips for keeping screening logs tidy."
  - "Our enrollment target is 240 participants across all sites, and we have 61 enrolled so far."
  - "What is a common reason participants drop out of diabetes trials?"
  - "How often should we review adverse event reports?"
  - "What is the difference between an adverse event and a serious adverse event?"
  - "Can you suggest a short reminder text for participants before a visit?"
  - "What does a data safety monitoring board do?"
  - "Our main site is in Sacramento and the site principal investigator is Dr. Helen Okafor."
  - "What is source data verification?"
  - "How should we store signed consent forms?"
  - "What is a protocol deviation? Give one example."
  - "How do I handle a participant who misses two visits in a row?"
  - "What is the role of the IRB during an ongoing trial?"
  - "One safety concern: participants taking warfarin need extra INR checks because of a possible interaction with the study drug."
  - "What is an inclusion criterion versus an exclusion criterion?"
  - "How long should trial records be kept after the study ends?"
  - "What is a case report form?"
  - "Give me one way to improve participant retention."
  - "What is the purpose of a run-in period?"
  - "Our IRB continuing review is due on March 14, so the renewal packet must be ready by March 1."
  - "What does 'intention-to-treat analysis' mean?"
  - "How do I prepare for a monitoring visit from the sponsor?"
  - "What is a good way to track visit windows?"
  - "Thanks, that is all the background for now. Please keep these details in mind."
