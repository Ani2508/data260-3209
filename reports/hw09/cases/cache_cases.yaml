# HW9 Part 3.1 - labeled semantic-cache test set (s3209, Clinical Trial Listings)
# Labels were fixed before any threshold sweep and must not be edited afterwards.
# Labeling mistakes found later are documented in the report, not changed here.
#
# seeds : queries answered once by the HW8 agents and stored in the cache
# cases : 40 incoming queries
#   exact      (10) same text as a seed                         -> expect hit on that seed
#   paraphrase (10) same meaning, different wording              -> expect hit on that seed
#   similar    (10) looks like a seed, different correct answer  -> expect miss (near = look-alike seed)
#   unrelated  (10) nothing in the cache answers it              -> expect miss
# Trial facts (s3209_rel, 2026-11-04): NCT30565986 Completed/0/Charite Berlin,
# NCT71134900 Terminated, NCT48236558 Recruiting/113/Stanford Medicine,
