# HW8 stack (PREFIX s3209, PORT_BASE 8509):  make hw08-up
#   kafka        single-node Kafka (KRaft), host port 9092
#   kafka-init   creates the s3209_* topics once, then exits
#   worker       consumes s3209_trial_requests, replies on s3209_trial_responses
#   api          FastAPI wrapper on http://127.0.0.1:8509
name: s3209-hw08

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: s3209_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: s3209_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        T="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --replication-factor 1"
        $$T --topic s3209_trial_requests --partitions 1
        $$T --topic s3209_trial_responses --partitions 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list | grep s3209_

  worker:
    build: .
    container_name: s3209_trial_worker
    command: ["python", "worker.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    container_name: s3209_trial_api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8509"]
    ports:
      - "127.0.0.1:8509:8509"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
