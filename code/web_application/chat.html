<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrialMate Memory Chat</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1d2b36; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .meta { color: #5b6b78; font-size: 13px; margin-bottom: 12px; }
  #log { border: 1px solid #d6dee5; border-radius: 8px; padding: 12px; height: 430px; overflow-y: auto; background: #f8fafb; }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; font-size: 14px; }
  .user { background: #0f6e74; color: #fff; margin-left: auto; }
  .assistant { background: #fff; border: 1px solid #d6dee5; }
  .used { font-size: 12px; color: #5b6b78; margin: -2px 0 10px; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  input { flex: 1; padding: 9px; border: 1px solid #b9c6d0; border-radius: 6px; font-size: 14px; }
  button { padding: 9px 16px; background: #0f6e74; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<h1>TrialMate Memory Chat (s3209)</h1>
<div class="meta">User: <b id="uid"></b> | Session: <b id="sid">new</b> | POST /api/chat</div>
<div id="log"></div>
<form id="f"><input id="m" placeholder="Type a message" autocomplete="off"><button>Send</button></form>
<script>
  const params = new URLSearchParams(location.search);
  const userId = params.get("user") || "ani_demo";
  let sessionId = params.get("session") || null;
  document.getElementById("uid").textContent = userId;
  const log = document.getElementById("log");
  function add(cls, text) {
    const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("m"); const text = input.value.trim();
    if (!text) return;
    add("user", text); input.value = "";
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, session_id: sessionId, message: text }) });
    const body = await r.json();
    if (!r.ok) { add("assistant", "Error " + r.status + ": " + JSON.stringify(body)); return; }
    sessionId = body.session_id; document.getElementById("sid").textContent = sessionId;
    add("assistant", body.reply);
    const u = document.createElement("div"); u.className = "used";
    u.textContent = `short-term: ${body.used.short_term.count} msgs | summary: ${body.used.long_term.session_summary ? "yes" : "no"} | facts: ${body.used.episodic_facts.map(f => f.fact).join("; ") || "none"}`;
    log.appendChild(u); log.scrollTop = log.scrollHeight;
  });
</script>
</body>
</html>
