<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Clinical Trial Registry</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f3f5f6;
    --ink: #10233b;
    --ink-soft: #52657a;
    --rule: #c7d1d9;
    --blue: #2b6cb0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
  }

  .registry-bar {
    background: var(--ink);
    border-bottom: 3px solid var(--blue);
  }

  .registry-bar .brand {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    color: #dde6ec;
    text-decoration: none;
  }

  .btn-ledger-outline {
    background: transparent;
    color: #dde6ec;
    border: 1px solid #dde6ec;
    border-radius: 3px;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
  }
  .btn-ledger-outline:hover { background: #dde6ec; color: var(--ink); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }

  .file-heading {
    font-family: "Lora", serif;
    font-weight: 600;
    font-size: 2rem;
    color: var(--ink);
    margin-bottom: 0.5rem;
  }
  .file-heading strong {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    color: var(--blue);
  }

  .status-line {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.9rem 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  .status-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--blue);
    flex-shrink: 0;
  }

  .status-value {
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
</style>
</head>

<body>
  <nav class="navbar registry-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand" href="/">CLINICAL TRIAL REGISTRY</a>
      <a href="/logout" class="btn-ledger-outline">Log out</a>
    </div>
  </nav>

  <main>
    <h1 class="file-heading">Welcome, <strong>{{ username }}</strong></h1>

    <div class="status-line">
      <span class="status-label">SESSION</span>
      <span class="status-value">You have successfully accessed the protected dashboard.</span>
    </div>
  </main>
</body>
</html>
