<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Clinical Trial Registry</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f3f5f6;
    --ink: #10233b;
    --ink-soft: #52657a;
    --rule: #c7d1d9;
    --blue: #2b6cb0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
  }

  .registry-bar {
    background: var(--ink);
    border-bottom: 3px solid var(--blue);
  }

  .registry-bar .brand {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    color: #dde6ec;
    text-decoration: none;
  }

  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }

  .file-heading {
    font-family: "Lora", serif;
    font-weight: 600;
    font-size: 1.9rem;
    color: var(--ink);
    margin-bottom: 1.75rem;
  }

  .form-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }

  .form-control {
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0.65rem 0.75rem;
  }
  .form-control:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(43,108,176,0.15);
  }

  .btn-ledger {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 0.75rem 1.6rem;
    font-weight: 600;
    font-size: 0.95rem;
    width: 100%;
  }
  .btn-ledger:hover { background: #0a1830; color: #fff; }

  .alert-registry {
    background: #fbe9e7;
    border: 1px solid #e39a90;
    color: #8a2f22;
    border-radius: 3px;
    font-size: 0.9rem;
    padding: 0.75rem 1rem;
  }
</style>
</head>

<body>
  <nav class="navbar registry-bar">
    <div class="container">
      <a class="brand" href="/">CLINICAL TRIAL REGISTRY</a>
    </div>
  </nav>

  <main>
    <h1 class="file-heading">Log in</h1>

    {% if message %}
      <div class="alert-registry mb-3" role="alert">{{ message }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <button type="submit" class="btn-ledger">Log in</button>
    </form>
  </main>
</body>
</html>
